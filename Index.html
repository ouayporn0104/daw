<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AR Microwave</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      z-index: 9999;

      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 10px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-size: 17px;
      font-weight: bold;
      color: white;
      background: #222;
      box-shadow: 0 4px 12px rgba(0,0,0,.35);
      cursor: pointer;
    }

    button:active {
      transform: scale(.95);
    }

    #warmBtn {
      background: #ff7a00;
    }

    #doorBtn {
      background: #007aff;
    }

    #temperature {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    #status {
      position: fixed;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;

      color: white;
      background: rgba(0,0,0,.55);
      padding: 7px 15px;
      border-radius: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- แสดงอุณหภูมิ/ระดับความอุ่น -->
  <div id="temperature">ความอุ่น: 50%</div>

  <div id="status">
    ส่องกล้องไปที่ Hiro Marker
  </div>

  <!-- ปุ่มควบคุม -->
  <div id="ui">
    <button id="warmBtn">🔥 เพิ่มความอุ่น</button>
    <button id="doorBtn">🚪 เปิดฝา</button>
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="antialias: true; alpha: true"
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- แสง -->
    <a-light
      type="ambient"
      color="#ffffff"
      intensity="1.5">
    </a-light>

    <a-light
      type="directional"
      position="2 4 3"
      intensity="1.5">
    </a-light>

    <!-- Hiro Marker -->
    <a-marker
      preset="hiro"
      id="hiroMarker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5">

      <!-- ================================= -->
      <!--        MICROWAVE                -->
      <!-- ================================= -->

      <a-entity
        id="microwave"
        position="0 0.5 0"
        scale="0.7 0.7 0.7">

        <!-- ตัวเครื่อง -->
        <a-box
          position="0 0.55 0"
          width="1.8"
          height="1.1"
          depth="1.2"
          color="#555555"
          material="roughness: 0.35; metalness: 0.7">
        </a-box>

        <!-- หน้าจอ -->
        <a-box
          position="0.45 0.8 -0.615"
          width="0.45"
          height="0.22"
          depth="0.03"
          color="#111111">
        </a-box>

        <!-- ตัวเลขบนหน้าจอ -->
        <a-text
          id="display"
          value="50%"
          position="0.45 0.8 -0.64"
          align="center"
          width="0.7"
          color="#00ff66">
        </a-text>

        <!-- ================================= -->
        <!-- ประตูไมโครเวฟ -->
        <!-- ================================= -->

        <a-entity
          id="door"
          position="-0.25 0.55 -0.66"
          rotation="0 0 0">

          <!-- กรอบประตู -->
          <a-box
            position="0 0 0"
            width="1.15"
            height="0.85"
            depth="0.08"
            color="#222222">
          </a-box>

          <!-- กระจกประตู -->
          <a-box
            position="0 0 0.045"
            width="1.0"
            height="0.70"
            depth="0.02"
            color="#111827"
            opacity="0.75">
          </a-box>

          <!-- มือจับ -->
          <a-box
            position="0.48 0 0.08"
            width="0.07"
            height="0.55"
            depth="0.08"
            color="#dddddd">
          </a-box>

        </a-entity>

        <!-- ================================= -->
        <!-- ปุ่มไมโครเวฟ -->
        <!-- ================================= -->

        <a-cylinder
          position="0.45 0.55 -0.65"
          rotation="90 0 0"
          radius="0.08"
          height="0.04"
          color="#cccccc">
        </a-cylinder>

        <a-cylinder
          position="0.45 0.35 -0.65"
          rotation="90 0 0"
          radius="0.08"
          height="0.04"
          color="#cccccc">
        </a-cylinder>

        <!-- จานหมุนด้านใน -->
        <a-cylinder
          position="-0.2 0.25 -0.1"
          rotation="0 0 0"
          radius="0.38"
          height="0.04"
          color="#eeeeee">
        </a-cylinder>

      </a-entity>

    </a-marker>

    <!-- กล้อง -->
    <a-entity camera></a-entity>

  </a-scene>

  <script>

    // ==========================================
    // ตัวแปร
    // ==========================================

    let warmth = 50;
    let doorOpen = false;

    const warmBtn = document.getElementById("warmBtn");
    const doorBtn = document.getElementById("doorBtn");

    const temperature =
      document.getElementById("temperature");

    const status =
      document.getElementById("status");

    const door =
      document.getElementById("door");

    const display =
      document.getElementById("display");

    const marker =
      document.getElementById("hiroMarker");


    // ==========================================
    // เพิ่มความอุ่น
    // ==========================================

    warmBtn.addEventListener("click", function () {

      warmth += 10;

      if (warmth > 100) {
        warmth = 0;
      }

      temperature.innerText =
        "ความอุ่น: " + warmth + "%";

      display.setAttribute(
        "value",
        warmth + "%"
      );

    });


    // ==========================================
    // เปิด / ปิดประตู
    // ==========================================

    doorBtn.addEventListener("click", function () {

      if (!doorOpen) {

        // เปิดประตู
        door.setAttribute(
          "animation",
          "property: rotation; to: 0 -65 0; dur: 500; easing: easeOutQuad"
        );

        doorBtn.innerText = "🚪 ปิดฝา";

        doorOpen = true;

      } else {

        // ปิดประตู
        door.setAttribute(
          "animation",
          "property: rotation; to: 0 0 0; dur: 500; easing: easeOutQuad"
        );

        doorBtn.innerText = "🚪 เปิดฝา";

        doorOpen = false;
      }

    });


    // ==========================================
    // ตรวจจับ Hiro Marker
    // ==========================================

    marker.addEventListener("markerFound", function () {

      status.innerText =
        "✅ พบ Hiro Marker - Microwave พร้อมใช้งาน";

      status.style.background =
        "rgba(0,150,60,.75)";

    });


    marker.addEventListener("markerLost", function () {

      status.innerText =
        "ส่องกล้องไปที่ Hiro Marker";

      status.style.background =
        "rgba(0,0,0,.55)";

    });

  </script>

</body>
</html>
